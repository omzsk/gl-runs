name: GitLab Full Restore Test

on:
  workflow_dispatch:
    inputs:
      scope:
        description: 'weekly: 1/8 danh sách; all: tất cả; single: một repo'
        type: choice
        options:
          - weekly
          - all
          - single
        default: all
      target:
        description: 'Tên đích GitLab khi chọn single, ví dụ KernelSU_5ec1cff'
        type: string
        required: false
  schedule:
    - cron: '17 3 * * 0' # Chủ nhật 10:17 (UTC+7)

permissions:
  contents: read

concurrency:
  group: gitlab-full-restore-test
  cancel-in-progress: false

jobs:
  prepare:
    name: Chọn danh sách kiểm tra
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Checkout cấu hình
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Chọn các repository
        id: select
        shell: bash
        env:
          TEST_SCOPE: ${{ inputs.scope || 'weekly' }}
          TEST_TARGET: ${{ inputs.target || '' }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import sys
          from datetime import date, datetime, timezone
          from pathlib import Path

          sys.path.insert(0, str(Path('scripts').resolve()))
          from parse_repos import parse_file

          entries = parse_file(Path('repos'))
          scope = os.environ['TEST_SCOPE']
          target = os.environ['TEST_TARGET'].strip()
          week = (datetime.now(timezone.utc).date() - date(2024, 1, 1)).days // 7
          shard = week % 8
          if scope == 'weekly':
              selected = entries[shard::8]
          elif scope == 'all':
              selected = entries
          elif scope == 'single':
              selected = [x for x in entries if x['target'].casefold() == target.casefold()]
              if not selected:
                  sys.exit(f'Không tìm thấy repository {target!r} trong file repos')
          else:
              sys.exit(f'Scope không hợp lệ: {scope}')
          if not selected:
              sys.exit('Không có repository để kiểm tra')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write('matrix=' + json.dumps({'include': selected}, separators=(',', ':')) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write(f'## Phạm vi kiểm tra khôi phục\n\n**{scope}**: {len(selected)}/{len(entries)} repository.\n')
              if scope == 'weekly':
                  out.write(f'\nNhóm tuần **{shard + 1}/8**. Đây KHÔNG phải kiểm tra 100% cả 64 repo trong một lượt.\n')
          print(f'Đã chọn {len(selected)}/{len(entries)} repository ({scope}).')
          PY

  verify:
    needs: prepare
    name: Kiểm tra ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 1  # Tránh tăng request rate limit trên GitLab
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      SOURCE_URL: ${{ matrix.source }}
      TARGET: ${{ matrix.target }}
      WITH_LFS: ${{ matrix.lfs }}
      WITH_WIKI: ${{ matrix.wiki }}
      WITH_WIKI_LFS: ${{ matrix.wiki_lfs }}
      GITLAB_NAMESPACE: ${{ vars.GITLAB_NAMESPACE }}
      GITLAB_HOST: ${{ vars.GITLAB_HOST || 'gitlab.com' }}
      GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
      GIT_TERMINAL_PROMPT: '0'
      GIT_LFS_SKIP_SMUDGE: '1'
      GIT_HTTP_MAX_REQUESTS: '2'
    steps:
      - name: Checkout mã kiểm tra
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Bảo đảm Git LFS khả dụng
        shell: bash
        run: |
          set -euo pipefail
          if ! git lfs version >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y git-lfs
          fi

      - name: Thiết lập xác thực GitLab (token không nằm trong URL)
        shell: bash
        run: |
          set -euo pipefail
          : "${GITLAB_TOKEN:?Thiếu secret GITLAB_TOKEN}"
          : "${GITLAB_NAMESPACE:?Thiếu variable GITLAB_NAMESPACE}"
          [[ "$GITLAB_HOST" =~ ^[a-zA-Z0-9.-]+(:[0-9]{1,5})?$ ]] || exit 1
          [[ "$GITLAB_NAMESPACE" =~ ^[A-Za-z0-9_.-]+(/[A-Za-z0-9_.-]+)*$ ]] || exit 1
          cat > "$RUNNER_TEMP/gitlab-askpass" <<'SH'
          #!/usr/bin/env bash
          # Chỉ trả secret cho URL có hostname GitLab đã cấu hình.
          case "$1" in
            *"$GITLAB_HOST"*)
              case "$1" in
                *Username*) printf '%s\n' 'oauth2' ;;
                *Password*) printf '%s\n' "$GITLAB_TOKEN" ;;
                *) printf '\n' ;;
              esac ;;
            *) printf '\n' ;;
          esac
          SH
          chmod 700 "$RUNNER_TEMP/gitlab-askpass"
          echo "GIT_ASKPASS=$RUNNER_TEMP/gitlab-askpass" >> "$GITHUB_ENV"

      - name: So sánh GitHub và kiểm tra khôi phục từ GitLab
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_restore_full.py \
            --source "$SOURCE_URL" \
            --destination "https://${GITLAB_HOST}/${GITLAB_NAMESPACE}/${TARGET}.git" \
            --target "$TARGET" \
            --lfs "$WITH_LFS" \
            --wiki "$WITH_WIKI" \
            --wiki-lfs "$WITH_WIKI_LFS" \
            --report "restore-results/${TARGET}.json"

      - name: Lưu JSON báo cáo (kể cả khi test thất bại)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-report-${{ matrix.target }}
          path: restore-results/*.json
          if-no-files-found: warn
          retention-days: 30

  summary:
    name: Tổng hợp kết quả tiếng Việt
    needs: [prepare, verify]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Tải kết quả từng repository
        if: ${{ needs.prepare.result == 'success' }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: restore-report-*
          path: restore-results
          merge-multiple: true

      - name: Hiện summary tiếng Việt và báo Failed nếu kiểm tra chưa đạt
        shell: bash
        env:
          MATRIX_JSON: ${{ needs.prepare.outputs.matrix }}
          PREPARE_STATUS: ${{ needs.prepare.result }}
          VERIFY_STATUS: ${{ needs.verify.result }}
        run: |
          python3 - <<'PY'
          import glob, json, os, sys
          from pathlib import Path
          selected = json.loads(os.environ.get('MATRIX_JSON') or '{}').get('include', [])
          reports = {}
          for file in glob.glob('restore-results/*.json'):
              try:
                  data = json.loads(Path(file).read_text(encoding='utf-8'))
                  reports[data['target']] = data
              except (OSError, KeyError, ValueError):
                  pass
          rows = ['## Báo cáo Full Restore Test — GitHub ↔ GitLab', '',
                  '| Repository | Git và LFS | Wiki | Kết luận |', '|---|---|---|---|']
          passed = 0
          counts = {}
          for entry in selected:
              name = entry['target']
              item = reports.get(name, {})
              status = item.get('status', 'CHƯA XÁC MINH')
              counts[status] = counts.get(status, 0) + 1
              if status == 'ĐẠT':
                  passed += 1
              rows.append(f'| `{name}` | {item.get("repository", {}).get("status", "KHÔNG CÓ BÁO CÁO")} '
                          f'| {item.get("wiki", {}).get("status", "KHÔNG CÓ BÁO CÁO")} | **{status}** |')
          rows += ['', f'**ĐẠT: {passed}/{len(selected)} repository được chọn.**', '',
                   '**Thống kê theo nguyên nhân:** ' + '; '.join(f'{key}: {value}' for key, value in sorted(counts.items())),
                   f'Workflow chuẩn bị: `{os.environ["PREPARE_STATUS"]}`; '
                   f'kiểm tra: `{os.environ["VERIFY_STATUS"]}`.', '']
          def esc(s):
              return str(s).replace('|', chr(92) + '|').replace('\n', ' ').replace('\r', ' ')[:350]
          def sha(value):
              return str(value)[:12] if value else '—'
          # Aggregate diagnostics, so users don't need to open 64 separate matrix-job summaries.
          for entry in selected:
              name = entry['target']
              item = reports.get(name, {})
              if item.get('status') == 'ĐẠT':
                  continue
              rows += [f'### {esc(name)} — {item.get("status", "CHƯA XÁC MINH")}', '']
              rows.append(f'Thời điểm bắt đầu kiểm tra (UTC): `{item.get("time_utc", "không có báo cáo")}`. ')
              if not item:
                  rows.append('Không có JSON report. Xem log matrix job, lỗi runner hoặc upload artifact.')
                  continue
              for key, label in [('repository', 'Repository'), ('wiki', 'Wiki')]:
                  section = item.get(key, {})
                  if section.get('status') in ('ĐẠT', 'BỎ QUA', 'KHÔNG CÓ'):
                      continue
                  rows += [f'**{label}: {esc(section.get("status", "CHƯA XÁC MINH"))}** — '
                           f'{esc(section.get("error", "Không có thông báo lỗi chi tiết"))}', '']
                  issues = section.get('issues') or []
                  if issues:
                      rows += [f'{len(issues)} ref khác nhau (hiển thị tối đa 10, toàn bộ trong JSON artifact):', '',
                               '| Ref | Nguyên nhân | GitHub SHA / commit UTC | GitLab SHA / commit UTC |',
                               '|---|---|---|---|']
                      for problem in issues[:10]:
                          gh = problem.get('github') or {}
                          gl = problem.get('gitlab') or {}
                          reason = problem.get('reason', '')
                          rows.append(f'| `{esc(problem["ref"])}` | {esc(problem["kind"] + ": " + reason)} '
                                      f'| `{sha(problem.get("github_sha"))}` / `{gh.get("commit_time") or "—"}` '
                                      f'| `{sha(problem.get("gitlab_sha"))}` / `{gl.get("commit_time") or "—"}` |')
                      rows.append('')
                  for change in (section.get('snapshot_changes') or [])[:10]:
                      rows.append(f'- Ref đổi trong lúc test: `{esc(change["ref"])}`: '
                                  f'`{sha(change.get("old"))}` → `{sha(change.get("new"))}`')
          rows += ['', '**Diễn giải:** `CHƯA ĐỒNG BỘ` = GitLab đang ở commit tổ tiên của GitHub, '
                   'không đồng nghĩa corrupt. `LỆCH REFS` = có nhánh/tag không khớp, cần xem nguyên nhân. '
                   '`THIẾU LFS` = chưa khôi phục đủ object LFS. `LỖI DỮ LIỆU` = Git fsck hoặc SHA-256 phát hiện lỗi. '
                   '`CHƯA XÁC MINH` = nguồn/đích thay đổi khi test, lỗi mạng/rate limit, hoặc chưa kiểm tra xong.', '',
                   '> Thời gian hiển thị của ref là **committer date**, không phải giờ push/backup. '
                   'Kiểm tra so sánh dữ liệu tại snapshot quan sát, không bao gồm Issues/PR/Releases/metadata. '
                   'Repo có thể bị lệch do lịch backup 6 giờ chưa kịp chạy; xem JSON artifact để xác minh.', '']
          text = '\n'.join(rows)
          print(text)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write(text)
          if not selected or passed != len(selected) or os.environ['VERIFY_STATUS'] != 'success':
              sys.exit('Full Restore Test: một hoặc nhiều repository chưa ĐẠT')
          PY
